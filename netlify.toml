[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 7 / React 19 require a modern Node.
  NODE_VERSION = "22"

# Routing (clean per-route rewrites + 404 fallback) lives in public/_redirects,
# which Netlify processes first.

# Baseline security headers (HSTS is already applied by Netlify).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Long-cache the fingerprinted build assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
