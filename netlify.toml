[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 7 / React 19 require a modern Node.
  NODE_VERSION = "22"

# Known routes are prerendered to dist/<route>/index.html and served directly
# (200) by Netlify's pretty-URL handling; the SPA boots from there. Genuinely
# unknown paths fall through to the 404 page with a real 404 status (no soft-404).
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Baseline security headers (HSTS is already applied by Netlify).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Long-cache the fingerprinted build assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
