[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 7 / React 19 require a modern Node.
  NODE_VERSION = "22"

# SPA fallback: serve index.html for every route so deep links
# (/about, /services, /work, /founding-clients, /contact) and refreshes
# don't 404. react-router takes over on the client.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Baseline security headers (HSTS is already applied by Netlify).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Long-cache the fingerprinted build assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
